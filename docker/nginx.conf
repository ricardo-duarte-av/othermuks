# Websockets: gomuks' /_gomuks/websocket needs the upgrade passed through, plain requests must not carry it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml application/wasm;

    # /_gomuks/, written by docker-entrypoint.d/30-othermuks-backend.sh when GOMUKS_BACKEND is set.
    # Without it the container only serves the app and the user points it at a backend from the UI.
    include /etc/nginx/othermuks/*.conf;

    # Hashed filenames: safe to keep forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html and the service workers decide which build the browser runs, so they are always revalidated.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~ ^/(media-sw|pushmuks-sw)\.js$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
